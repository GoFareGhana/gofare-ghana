
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087a45">
  <title>GoFare Ghana — Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #18352a;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px #0000000d;
    }

    h1, h2 { color: #087a45; }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #ccd8d0;
    }

    button {
      background: #087a45;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary { background: #34584a; }

    .hidden { display: none; }

    .message {
      padding: 10px;
      background: #edf6f0;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .record {
      border: 1px solid #e0e8e2;
      border-radius: 9px;
      padding: 12px;
      margin: 10px 0;
    }

    .record button {
      width: auto;
      padding: 9px 14px;
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="panel">
      <h1>GoFare Ghana</h1>
      <p>Administrator Dashboard</p>
      <p>Manage stations, routes and transport fares.</p>
    </header>

    <section id="login-panel" class="panel">
      <h2>Administrator Login</h2>

      <form id="login-form">
        <input
          id="admin-email"
          type="email"
          placeholder="Administrator email"
          required
        >

        <input
          id="admin-password"
          type="password"
          placeholder="Password"
          required
        >

        <button type="submit">Sign in</button>
      </form>

      <p id="login-message" class="message" role="status"></p>
    </section>

    <section id="dashboard" class="hidden">

      <div class="panel">
        <h2>Dashboard</h2>
        <p id="admin-welcome"></p>
        <button id="logout-button" class="secondary">
          Sign out
        </button>
        <p id="dashboard-message" class="message"></p>
      </div>

      <div class="panel">
        <h2>Stations</h2>
        <div id="station-management"></div>
      </div>

      <div class="panel">
        <h2>Routes</h2>
        <div id="route-management"></div>
      </div>

      <div class="panel">
        <h2>Fare Management</h2>
        <div id="fare-management"></div>
      </div>

      <div class="panel">
        <h2>Passenger Reports</h2>
        <div id="report-management"></div>
      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
